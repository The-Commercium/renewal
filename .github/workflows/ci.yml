name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q python/tests
        env:
          PYTHONPATH: python/src

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R tests use the shared vectors
        run: cmp conformance/vectors.json r/tests/testthat/vectors.json
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::testthat, any::jsonlite
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual")'

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: js
      - run: npx tsc -p tsconfig.json
        working-directory: js
      - run: npm test
        working-directory: js
