[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "renewal"
version = "0.1.0"
description = "Retention, lifetime and conversion statistics for subscription products: sBG and beta-discrete-Weibull models, DEL/DERL, Jeffreys and hierarchical rates. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haluk Demirhan" }, { name = "Commercium Limited" }]
keywords = ["retention", "churn", "subscription", "lifetime value", "survival analysis", "statistics", "bayesian"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/The-Commercium/renewal"
Specification = "https://github.com/The-Commercium/renewal/blob/main/spec/MODEL.md"
Issues = "https://github.com/The-Commercium/renewal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/renewal"]
